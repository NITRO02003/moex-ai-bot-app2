<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MOEX Agent (Local)</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: #0b0f17; color: #e7e9ee; }
    header { padding: 12px 16px; background: #121a2a; border-bottom: 1px solid #23314f; }
    main { display: grid; grid-template-columns: 1fr 420px; gap: 12px; padding: 12px; }
    .panel { background: #0f1626; border: 1px solid #23314f; border-radius: 10px; overflow: hidden; }
    .panel h2 { margin: 0; padding: 10px 12px; background: #121a2a; border-bottom: 1px solid #23314f; font-size: 14px; }
    #chat { padding: 12px; height: calc(100vh - 160px); overflow: auto; }
    .msg { margin: 10px 0; padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; }
    .user { background: #1f2a44; }
    .assistant { background: #132a1f; }
    .tools { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; padding: 12px; height: calc(100vh - 160px); overflow: auto; }
    .row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #23314f; }
    textarea { flex: 1; min-height: 54px; resize: vertical; padding: 10px; border-radius: 10px; border: 1px solid #23314f; background: #0b0f17; color: #e7e9ee; }
    button { padding: 10px 14px; border-radius: 10px; border: 1px solid #23314f; background: #1f2a44; color: #e7e9ee; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .hint { color: #aab3c5; font-size: 12px; padding: 10px 12px; border-top: 1px solid #23314f; }
  </style>
</head>
<body>
  <header>
    <div><b>MOEX Agent</b> (Local LM Studio)</div>
  </header>

  <main>
    <section class="panel">
      <h2>Chat</h2>
      <div id="chat"></div>
      <div class="row">
        <textarea id="input" placeholder="Например: Диагностируй почему range-v3 даёт 0 сделок. Прочитай app2/range/config.json и предложи следующую проверку."></textarea>
        <button id="send">Send</button>
      </div>
      <div class="hint">
        Совет: проси агента использовать инструменты <code>read_text</code> и <code>run_cli</code> вместо вставки больших файлов.
      </div>
    </section>

    <aside class="panel">
      <h2>Tool log</h2>
      <div id="tools" class="tools"></div>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
